<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="GTA World chatlog formatter and scene builder"><title>GTAW ChatTool</title><link rel="stylesheet" href="css/app.css"></head><body>
<header><div><h1>GTAW ChatTool</h1><span>Chatlog formatter & scene builder</span></div><b>v1.0 alpha</b></header>
<main><aside>
<section><h2>1 · Import</h2><div class="row"><label>Format<select id="mode"><option value="auto">Auto detect</option><option value="ucp">GTAW UCP</option><option value="assistant">GTAW Assistant</option></select></label><label>Your character<input id="self" placeholder="Jovan Tomic"></label></div><textarea id="source" placeholder="Paste a GTAW UCP or GTAW Assistant chatlog..."></textarea><div class="row"><button class="primary" id="build">Build scene</button><button id="sample">Sample</button><button id="clear">Clear</button></div><p id="detected" class="muted">Waiting for a chatlog.</p></section>
<section><h2>2 · Clean & filter</h2><div class="row"><label><input type="checkbox" id="rp" checked> RP only</label><label><input type="checkbox" id="ooc"> OOC</label><label><input type="checkbox" id="system"> System</label></div><div class="row"><label>From<input id="from" type="time" step="1"></label><label>To<input id="to" type="time" step="1"></label><button id="apply">Apply</button></div><div id="people" class="chips"></div></section>
<section><h2>3 · Preview & export</h2><div class="row"><label>Width<select id="width"><option value="720">720</option><option value="900">1080p</option><option value="1100">1440p</option><option value="1350">4K</option></select></label><label>Font<input id="font" type="range" min="11" max="28" value="16"><span id="fontv">16</span></label></div><div class="row"><label><input type="checkbox" id="timestamps"> Timestamps</label><label><input type="checkbox" id="chatbg"> Chat background</label></div><div class="row"><button id="undo">Undo</button><button id="redo">Redo</button><button id="save">Save</button><button id="load">Load</button></div><div class="row"><button class="primary" id="png">PNG</button><button id="copy">Copy text</button></div></section>
</aside><div class="workspace"><section><div class="head"><h2>Scene Builder</h2><div><button id="all">All</button> <button id="none">None</button></div></div><div id="list" class="list"><p class="empty">Paste a log and build your scene.</p></div></section><section class="previewbox"><div class="head"><h2>Live GTAW Preview</h2><span id="stats" class="muted"></span></div><div id="stage"><div id="preview"></div></div></section></div></main><script type="module" src="js/app.js"></script></body></html>
